<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="ABYSSAL — A first-person horror melee survival game. Survive the waves." />
    <title>ABYSSAL — Horror Melee Survival</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #050505;
        overflow: hidden;
        font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
        color: #d8d8d8;
        -webkit-font-smoothing: antialiased;
      }
      #root { width: 100vw; height: 100vh; }
      /* Initial loader so the page isn't blank before React mounts */
      #boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 60%, #1a0a0a 0%, #050505 70%);
        z-index: 50;
      }
      #boot .pulse {
        width: 14px; height: 14px; border-radius: 50%;
        background: #b91c1c; box-shadow: 0 0 24px #b91c1c;
        animation: bootpulse 1.1s ease-in-out infinite;
      }
      @keyframes bootpulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.8);opacity:.4} }
    </style>
  </head>
  <body>
    <div id="boot"><div class="pulse"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
